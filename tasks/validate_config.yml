---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "stirling_pdf_config_path", "new": "<removed>" }
    - { "old": "stirling_pdf_env_path", "new": "<removed>" }
    - { "old": "stirling_pdf_extra_config", "new": "<removed>" }
    - { "old": "stirling_pdf_trainingData_path", "new": "stirling_pdf_trainingdata_path" }
    - { "old": "stirling_pdf_container_additional_mounts", "new": "stirling_pdf_container_additional_volumes" }
    - { "old": "stirling_pdf_http_header_content_permission_policy", "new": "stirling_pdf_http_header_permissions_policy" }
    - { "old": "stirling_pdf_environment_variables_extension", "new": "stirling_pdf_environment_variables_additional_variables" }
    - { "old": "stirling_pdf_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required Stirling PDF settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item.name }}`).
  when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
  with_items:
    - { "name": "stirling_pdf_uid", when: true }
    - { "name": "stirling_pdf_gid", when: true }
    - { "name": "stirling_pdf_hostname", when: true }
    - { "name": "stirling_pdf_path_prefix", when: true }
    - { "name": "stirling_pdf_container_network", when: true }
    - { "name": "stirling_pdf_container_labels_traefik_middleware_basic_auth_users", when: "{{ stirling_pdf_container_labels_traefik_middleware_basic_auth_enabled }}" }

- name: Run if Traefik is enabled
  when: stirling_pdf_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for Stirling PDF are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - stirling_pdf_container_labels_traefik_hostname
        - stirling_pdf_container_labels_traefik_path_prefix

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `stirling_pdf_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if stirling_pdf_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          stirling_pdf_container_labels_traefik_path_prefix (`{{ stirling_pdf_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/actual`).
      when: "stirling_pdf_container_labels_traefik_path_prefix != '/' and stirling_pdf_container_labels_traefik_path_prefix[-1] == '/'"

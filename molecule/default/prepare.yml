---
- name: Prepare Stirling PDF Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Stirling PDF Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Stirling PDF Molecule tests preparation
      ansible.builtin.package:
        name:
          # Used by the verification playbook to upload documents to the
          # conversion API. `ansible.builtin.uri` cannot do that: its
          # `form-multipart` bodies carry `Content-Transfer-Encoding: base64`,
          # which Tomcat does not decode.
          - curl
          - python3-requests
        state: present

    - name: Ensure Docker is installed for Stirling PDF Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: vfs
